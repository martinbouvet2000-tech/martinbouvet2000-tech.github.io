<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Georgia,'Iowan Old Style',serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0d0a"/><stop offset="1" stop-color="#16120c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0" stop-color="#f0883e" stop-opacity=".22"/><stop offset="1" stop-color="#f0883e" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#221c14" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="980" cy="315" r="300" fill="url(#glow)"/>

  <!-- 24h dial: night arc + job dots -->
  <g transform="translate(950,315)">
    <path d="M0 -190 A190 190 0 0 1 134 134" fill="none" stroke="#f0f6fc" stroke-opacity=".05" stroke-width="54"/>
    <circle r="190" fill="none" stroke="#2b2318"/>
    <circle r="156" fill="none" stroke="#2b2318" stroke-dasharray="2 7"/>
    <g fill="#f0883e">
      <circle cx="-9" cy="-172" r="7"/>
      <circle cx="122" cy="-122" r="7"/>
      <circle cx="172" cy="-9" r="7"/>
      <circle cx="-172" cy="9" r="7"/>
      <circle cx="-122" cy="-122" r="7"/>
    </g>
    <line x1="0" y1="0" x2="-96" y2="-96" stroke="#f0f6fc" stroke-width="3" stroke-linecap="round"/>
    <circle r="5" fill="#f0f6fc"/>
    <text y="72" text-anchor="middle" fill="#8a8274" font-size="17" font-family="ui-monospace,Consolas,monospace" letter-spacing="3">00:30</text>
  </g>

  <text x="80" y="118" font-family="ui-monospace,Consolas,monospace" font-size="20" fill="#f0883e" letter-spacing="3">MARTIN BOUVET</text>
  <text x="80" y="255" font-size="76" fill="#f7f2e8">I build AI systems</text>
  <text x="80" y="340" font-size="76" fill="#f7f2e8">that work</text>
  <text x="80" y="425" font-size="76" font-style="italic" fill="#f0883e">while I don't.</text>
  <text x="80" y="505" font-family="-apple-system,'Segoe UI',Helvetica,sans-serif" font-size="25" fill="#b6ad9c">Agent systems · shipped products · from market thesis to code</text>
  <line x1="80" y1="545" x2="1120" y2="545" stroke="#2b2318"/>
  <text x="80" y="585" font-family="ui-monospace,Consolas,monospace" font-size="19" fill="#8a8274">martinbouvet2000-tech.github.io</text>
  <text x="1120" y="585" text-anchor="end" font-family="ui-monospace,Consolas,monospace" font-size="19" fill="#8a8274">5 case studies</text>
</svg>
